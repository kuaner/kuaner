<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Kuaner — Make it useful. Then make it quiet.</title>
  <desc id="desc">A compact warm editorial banner for the mobile GitHub profile.</desc>

  <defs>
    <clipPath id="panel">
      <rect width="900" height="620" rx="30"/>
    </clipPath>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#161616" opacity="0.13"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F4EA"/>
      <stop offset="0.6" stop-color="#F2EDE1"/>
      <stop offset="1" stop-color="#E8E1D3"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="900" height="620" fill="url(#paper)"/>
    <rect width="900" height="620" fill="url(#dots)"/>

    <circle cx="760" cy="238" r="166" fill="none" stroke="#161616" stroke-opacity="0.075"/>
    <circle cx="760" cy="238" r="126" fill="none" stroke="#161616" stroke-opacity="0.1"/>
    <circle cx="760" cy="238" r="86" fill="none" stroke="#161616" stroke-opacity="0.06"/>
    <line x1="760" y1="28" x2="760" y2="450" stroke="#161616" stroke-opacity="0.05"/>
    <line x1="580" y1="238" x2="900" y2="238" stroke="#161616" stroke-opacity="0.05"/>

    <rect x="48" y="46" width="13" height="13" rx="2" fill="#FF5A36"/>
    <text x="74" y="59" fill="#161616" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="2.2">KUANER / TOOLS FOR EVERYDAY LIFE</text>

    <g font-family="'Iowan Old Style', Baskerville, 'Times New Roman', serif">
      <text x="46" y="190" fill="#161616" font-size="116" font-weight="700" letter-spacing="-4">Make it</text>
      <text x="46" y="302" fill="#161616" font-size="116" font-weight="700" letter-spacing="-4">useful.</text>
      <text x="48" y="400" fill="#FF5A36" font-size="72" font-style="italic" font-weight="700" letter-spacing="-2.3">Then make it quiet.</text>
    </g>

    <text x="50" y="474" fill="#504C44" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="31" letter-spacing="0.2">把 AI、硬件与日常工具，</text>
    <text x="50" y="518" fill="#504C44" font-family="'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif" font-size="31" letter-spacing="0.2">做成真正会用的东西。</text>

    <text x="50" y="568" fill="#7B756A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.8">BUILD · OBSERVE · REFINE</text>

    <g transform="translate(700 500)">
      <rect x="4" y="5" width="116" height="75" rx="16" fill="#161616" opacity="0.13"/>
      <rect width="116" height="75" rx="16" fill="#161616"/>
      <rect x="7" y="7" width="102" height="61" rx="9" fill="#EEE9DE"/>
      <rect x="18" y="20" width="42" height="4" rx="2" fill="#161616"/>
      <rect x="18" y="30" width="70" height="4" rx="2" fill="#161616" opacity="0.24"/>
      <rect x="18" y="44" width="10" height="11" rx="2" fill="#161616" opacity="0.25"/>
      <rect x="33" y="39" width="10" height="16" rx="2" fill="#FF5A36"/>
      <rect x="48" y="47" width="10" height="8" rx="2" fill="#161616" opacity="0.25"/>
      <rect x="63" y="43" width="10" height="12" rx="2" fill="#161616" opacity="0.4"/>
      <circle cx="94" cy="20" r="3" fill="#FF5A36"/>
    </g>

    <line x1="200" y1="563" x2="676" y2="563" stroke="#161616" stroke-opacity="0.16"/>
    <circle cx="687" cy="563" r="3" fill="#161616" opacity="0.5"/>
    <rect x="0.5" y="0.5" width="899" height="619" rx="29.5" fill="none" stroke="#161616" stroke-opacity="0.13"/>
  </g>
</svg>
